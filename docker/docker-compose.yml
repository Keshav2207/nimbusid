services:

  postgres:
    image: postgres:17
    container_name: nimbusid-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: nimbusid
      POSTGRES_USER: nimbusid
      POSTGRES_PASSWORD: nimbusid

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
